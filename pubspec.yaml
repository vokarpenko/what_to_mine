name: what_to_mine
description: App for calculate best profit coin for mining.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+4

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.0.0
  http: ^1.5.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.2
  built_value: ^8.9.2
  built_collection: ^5.1.1
  floor: ^1.5.0
  sqflite: ^2.4.2
  flutter_local_notifications: ^21.0.0
  background_fetch: ^1.4.0
  easy_localization: ^3.0.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.13
  built_value_generator: ^8.9.2
  floor_generator: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
    - assets/icons/coins/
    - assets/json/
    - assets/images/
    - assets/translations/
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  # Та же монета, что на сплэше. С inset 16% по умолчанию она занимает ~73dp из 108dp
  image_path: "assets/images/splash_coin.png"
  adaptive_icon_background: "#F8B828"               # цвет внешнего ободка монеты
  adaptive_icon_foreground: "assets/images/splash_coin.png"
